<style>
:root{
--ink:#0b0b0c;
--paper:#f8f4ee;
--race:#e0132a;
--court-1:#d9772f;
--court-2:#a94a1c;
--court-3:#5c1f0d;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
color:var(--paper);
font-family:'Work Sans', sans-serif;
min-height:100vh;
}

.hero{
position:relative;
min-height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
background:
linear-gradient(180deg, rgba(6,8,14,0.25) 0%, rgba(6,8,14,0.58) 60%, rgba(6,8,14,0.86) 100%),
url('hero-bg.jpg') center/cover no-repeat;
}

header.top{
position:relative; z-index:2;
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding: max(28px, calc(env(safe-area-inset-top) * 0.42)) clamp(22px,5vw,56px) 0;
font-family:'JetBrains Mono', monospace;
font-size:11px;
letter-spacing:.14em;
color: rgba(248,244,238,0.75);
text-transform:uppercase;
}

main{
position:relative; z-index:2;
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding: 40px 20px 64px;
}

.mark-slot{
width: clamp(88px, 16vw, 120px);
height: clamp(88px, 16vw, 120px);
margin-bottom: 20px;
display:flex;
align-items:center;
justify-content:center;
filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35));
}
.mark-slot img{ width:100%; height:100%; object-fit:contain; }

.headline{
font-family:'Anton', sans-serif;
font-weight:400;
font-size: clamp(50px, 12.15vw, 133px);
line-height:1.05;
letter-spacing: 0.005em;
text-transform:uppercase;
color:var(--paper);
max-width: 1180px;
}

.subtext{
margin-top:22px;
max-width:600px;
font-size: clamp(14px,1.9vw,17px);
line-height:1.32;
color: rgba(248,244,238,0.88);
font-weight:400;
}

.cta-row{
margin-top: 34px;
display:flex;
gap:18px;
justify-content:center;
}
.pill{
display:flex;
align-items:center;
justify-content:center;
width:60px;
height:60px;
border-radius:50%;
flex-shrink:0;
text-decoration:none;
transition: transform .15s ease, background .2s ease, opacity .2s ease;
}
.pill svg, .pill img{ width:24px; height:24px; }
.pill:hover{ transform: translateY(-2px); }
.pill.solid{
background:var(--race);
color:var(--paper);
}
.pill.solid:hover{ opacity:.9; }
.pill.outline{
background: rgba(6,8,14,0.4);
color:var(--paper);
border:1.5px solid rgba(248,244,238,0.7);
}
.pill.outline:hover{
background: rgba(6,8,14,0.6);
border-color:var(--paper);
}
.pill:focus-visible{
outline: 2px solid var(--paper);
outline-offset:3px;
}

.gallery{
position:relative; z-index:2;
width:100%;
max-width:420px;
margin-top:40px;
}
.gallery-label{
font-family:'JetBrains Mono', monospace;
font-size:10px;
letter-spacing:.15em;
text-transform:uppercase;
color: rgba(248,244,238,0.55);
margin-bottom:12px;
}
.gallery-viewport{
position:relative;
}
.gallery-track{
--slide-w: 96%;
display:flex;
gap:10px;
overflow-x:auto;
scroll-snap-type:x mandatory;
-webkit-overflow-scrolling:touch;
scrollbar-width:none;
-ms-overflow-style:none;
padding-block:2px;
padding-inline: calc((100% - var(--slide-w)) / 2);
margin:-2px;
}
.gallery-track::-webkit-scrollbar{ display:none; }
.gallery-track .slide{
flex:0 0 var(--slide-w);
aspect-ratio: 3 / 4;
border-radius:20px;
overflow:hidden;
border:1.5px solid rgba(248,244,238,0.25);
background: rgba(248,244,238,0.08);
scroll-snap-align:center;
}
.gallery-arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
width:24px; height:24px;
border-radius:50%;
background: rgba(11,11,12,0.4);
border:1px solid rgba(248,244,238,0.35);
color: rgba(248,244,238,0.75);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:3;
transition: background .2s ease, opacity .2s ease;
padding:0;
opacity:.8;
}
.gallery-arrow:hover{ background: rgba(11,11,12,0.65); opacity:1; }
.gallery-arrow:focus-visible{ outline:2px solid var(--paper); outline-offset:2px; }
.gallery-arrow.prev{ left:6px; }
.gallery-arrow.next{ right:6px; }
.gallery-arrow svg{ width:11px; height:11px; }
@media (hover:none) and (pointer:coarse){
.gallery-arrow{ display:none; }
}
.gallery-track img{
width:100%;
height:100%;
object-fit:cover;
display:block;
pointer-events:none;
}

.divider{
position:relative; z-index:2;
width:100%;
max-width:420px;
margin: 42px 0 6px;
display:flex;
align-items:center;
gap:14px;
color: rgba(248,244,238,0.55);
font-family:'JetBrains Mono', monospace;
font-size:10px;
letter-spacing:.15em;
text-transform:uppercase;
}
.divider::before, .divider::after{
content:'';
flex:1;
height:1px;
background: rgba(248,244,238,0.3);
}

.link-stack{
position:relative; z-index:2;
margin-top: 22px;
display:flex;
flex-direction:column;
gap:12px;
width: 100%;
max-width: 420px;
}
.link-pill{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding: 14px 22px;
border-radius:999px;
border:1.5px solid rgba(248,244,238,0.55);
color:var(--paper);
text-decoration:none;
font-family:'Work Sans', sans-serif;
font-weight:500;
font-size:13.5px;
background: rgba(6,8,14,0.35);
transition: background .2s ease, border-color .2s ease, transform .15s ease;
}
.link-pill:hover{
background: rgba(6,8,14,0.6);
border-color: var(--paper);
transform: translateY(-1px);
}
.link-pill:focus-visible{
outline: 2px solid var(--paper);
outline-offset:2px;
}

footer{
position:relative; z-index:2;
padding: 26px clamp(20px,5vw,56px) 34px;
text-align:center;
font-family:'JetBrains Mono', monospace;
font-size:10.5px;

color: rgba(248,244,238,0.55);
text-transform:uppercase;
}

@media (max-width:480px){

main{ padding: 28px 18px 48px; }

.headline{
font-size: clamp(40px, 13.5vw, 65px);

.subtext{ margin-top:16px; font-size:14px; }
.cta-row{ margin-top:26px; gap:14px; }
.pill{ width:52px; height:52px; }
.pill svg, .pill img{ width:21px; height:21px; }
.divider{ margin:32px 0 4px; }
.link-stack{ margin-top:18px; gap:10px; }
.link-pill{ padding:13px 18px; font-size:13px; }
footer{ padding: 20px 20px 26px; }
}
</style>
</head>

<script>
(function(){
  var track = document.querySelector('.gallery-track');
  if(!track) return;
  var realSlides = Array.prototype.slice.call(track.children);
  if(realSlides.length < 2) return; // nothing to loop with only one photo

  // clone first/last slide to each end so scrolling past an edge lands on a
  // duplicate — then we silently jump back to the real slide (classic
  // infinite-carousel trick)
  var firstClone = realSlides[0].cloneNode(true);
  var lastClone = realSlides[realSlides.length - 1].cloneNode(true);
  firstClone.setAttribute('aria-hidden', 'true');
  lastClone.setAttribute('aria-hidden', 'true');
  track.insertBefore(lastClone, realSlides[0]);
  track.appendChild(firstClone);

  var total = realSlides.length; // count of real slides
  // track.children is now [lastClone, ...real(1..total), firstClone]

  function slideStep(){
    var s = track.children[1];
    var rect = s.getBoundingClientRect();
    var style = getComputedStyle(track);
    var gap = parseFloat(style.columnGap || style.gap || '0') || 0;
    return rect.width + gap;
  }

  function goTo(i, smooth){
    track.scrollTo({ left: slideStep() * i, behavior: smooth ? 'smooth' : 'auto' });
  }

  function currentIndex(){
    return Math.round(track.scrollLeft / slideStep());
  }

  // start on the first real slide, no animation
  requestAnimationFrame(function(){ goTo(1, false); });

  var settleTimer;
  track.addEventListener('scroll', function(){
    clearTimeout(settleTimer);
    settleTimer = setTimeout(function(){
      var i = currentIndex();
      if(i <= 0){ goTo(total, false); }
      else if(i >= total + 1){ goTo(1, false); }
    }, 120);
  }, { passive: true });

  var prevBtn = document.querySelector('.gallery-arrow.prev');
  var nextBtn = document.querySelector('.gallery-arrow.next');
  if(prevBtn) prevBtn.addEventListener('click', function(){ goTo(currentIndex() - 1, true); });
  if(nextBtn) nextBtn.addEventListener('click', function(){ goTo(currentIndex() + 1, true); });

  window.addEventListener('resize', function(){ goTo(currentIndex(), false); });
})();
</script>
