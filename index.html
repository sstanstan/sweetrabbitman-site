<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sweet Rabbit Man Official</title>
<meta name="description" content="Sweet Rabbit Man Official — official links.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b0b0c;
    --paper:#f2f1ec;
    --race:#e0132a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header.top{
    padding: 28px clamp(20px,5vw,56px) 0;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    color: rgba(242,241,236,0.55);
    text-transform:uppercase;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 24px;
  }

  /* placeholder for logo/mark artwork — drop an <img> here later */
  .mark-slot{
    width:96px; height:96px;
    margin-bottom: 28px;
    border:1.5px dashed rgba(242,241,236,0.25);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.08em;
    color: rgba(242,241,236,0.3);
    text-transform:uppercase;
  }

  .wordmark{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size: clamp(38px, 8vw, 74px);
    line-height:0.98;
    letter-spacing: 0.01em;
    text-transform:uppercase;
  }
  .wordmark .accent{ color:var(--race); }

  .tagline{
    margin-top:16px;
    font-family:'JetBrains Mono', monospace;
    font-size: clamp(11px,1.6vw,13px);
    letter-spacing:.2em;
    text-transform:uppercase;
    color: rgba(242,241,236,0.6);
  }

  .links{
    margin-top: 44px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    justify-content:center;
  }
  .btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 15px 32px;
    border:1.5px solid var(--paper);
    color:var(--paper);
    text-decoration:none;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    background:transparent;
    transition: background .2s ease, color .2s ease;
  }
  .btn:hover{
    background:var(--paper);
    color:var(--ink);
  }
  .btn.primary{
    border-color:var(--race);
    background:var(--race);
  }
  .btn.primary:hover{
    background: var(--paper);
    color: var(--race);
    border-color: var(--paper);
  }
  .btn:focus-visible{
    outline: 2px solid var(--race);
    outline-offset:3px;
  }

  footer{
    padding: 24px clamp(20px,5vw,56px) 30px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:.1em;
    color: rgba(242,241,236,0.4);
    text-transform:uppercase;
  }

  @media (max-width:480px){
    .links{ flex-direction:column; width:100%; }
    .btn{ justify-content:center; width:100%; }
  }
</style>
</head>
<body>
  <header class="top">
    <span>Sweet Rabbit Man Official</span>
  </header>

  <main>
    <div class="mark-slot" aria-hidden="true">logo</div>

    <h1 class="wordmark">Sweet Rabbit<br>Man</h1>
    <p class="tagline">Official</p>

    <nav class="links">
      <a class="btn primary" href="https://www.instagram.com/sweetrabbitman" target="_blank" rel="noopener">Instagram →</a>
      <a class="btn" href="https://x.com/sweetrabbitman" target="_blank" rel="noopener">X →</a>
    </nav>
  </main>

  <footer>
    <span>© 2026 Sweet Rabbit Man Official</span>
  </footer>
</body>
</html>
