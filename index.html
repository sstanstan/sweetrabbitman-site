<style>
:root{
--ink:#0b0b0c;
--paper:#f8f4ee;
--race:#e0132a;
--court-1:#d9772f;
--court-2:#a94a1c;
--court-3:#5c1f0d;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
color:var(--paper);
font-family:'Work Sans', sans-serif;
min-height:100vh;
}

.hero{
position:relative;
min-height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
background:
linear-gradient(180deg, rgba(6,8,14,0.25) 0%, rgba(6,8,14,0.58) 60%, rgba(6,8,14,0.86) 100%),
url('hero-bg.jpg') center/cover no-repeat;
}

header.top{
position:relative; z-index:2;
padding: 26px clamp(20px,5vw,56px) 0;
font-family:'JetBrains Mono', monospace;
font-size:11px;
letter-spacing:.12em;
color: rgba(248,244,238,0.75);
text-transform:uppercase;
}

main{
position:relative; z-index:2;
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding: 40px 20px 64px;
}

.mark-slot{
width: clamp(88px, 16vw, 120px);
height: clamp(88px, 16vw, 120px);
margin-bottom: 20px;
display:flex;
align-items:center;
justify-content:center;
filter: drop-shadow(0 2px 10px rgba(0,0,0,0.35));
}
.mark-slot img{ width:100%; height:100%; object-fit:contain; }

.headline{
font-family:'Anton', sans-serif;
font-weight:400;
font-size: clamp(56px, 13.5vw, 148px);
line-height:0.9;
letter-spacing: 0.005em;
text-transform:uppercase;
color:var(--paper);
text-shadow: 0 6px 34px rgba(0,0,0,0.45);
max-width: 1180px;
}

.subtext{
margin-top:22px;
max-width:600px;
font-size: clamp(14px,1.9vw,17px);
line-height:1.65;
color: rgba(248,244,238,0.88);
font-weight:400;
}

.cta-row{
margin-top: 34px;
display:flex;
flex-wrap:wrap;
gap:14px;
justify-content:center;
}
.pill{
display:inline-flex;
align-items:center;
gap:8px;
padding: 14px 26px;
border-radius:999px;
text-decoration:none;
font-family:'Work Sans', sans-serif;
font-weight:600;
font-size:14px;
letter-spacing:.01em;
transition: transform .15s ease, background .2s ease, opacity .2s ease;
}
.pill:hover{ transform: translateY(-2px); }
.pill.solid{
background:var(--race);
color:var(--paper);
}
.pill.solid:hover{ opacity:.9; }
.pill.outline{
background: rgba(6,8,14,0.4);
color:var(--paper);
border:1.5px solid rgba(248,244,238,0.7);
}
.pill.outline:hover{
background: rgba(6,8,14,0.6);
border-color:var(--paper);
}
.pill:focus-visible{
outline: 2px solid var(--paper);
outline-offset:3px;
}

.divider{
position:relative; z-index:2;
width:100%;
max-width:420px;
margin: 42px 0 6px;
display:flex;
align-items:center;
gap:14px;
color: rgba(248,244,238,0.55);
font-family:'JetBrains Mono', monospace;
font-size:10px;
letter-spacing:.15em;
text-transform:uppercase;
}
.divider::before, .divider::after{
content:'';
flex:1;
height:1px;
background: rgba(248,244,238,0.3);
}

.link-stack{
position:relative; z-index:2;
margin-top: 22px;
display:flex;
flex-direction:column;
gap:12px;
width: 100%;
max-width: 420px;
}
.link-pill{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding: 14px 22px;
border-radius:999px;
border:1.5px solid rgba(248,244,238,0.55);
color:var(--paper);
text-decoration:none;
font-family:'Work Sans', sans-serif;
font-weight:500;
font-size:13.5px;
background: rgba(6,8,14,0.35);
transition: background .2s ease, border-color .2s ease, transform .15s ease;
}
.link-pill:hover{
background: rgba(6,8,14,0.6);
border-color: var(--paper);
transform: translateY(-1px);
}
.link-pill:focus-visible{
outline: 2px solid var(--paper);
outline-offset:2px;
}

footer{
position:relative; z-index:2;
padding: 26px clamp(20px,5vw,56px) 34px;
text-align:center;
font-family:'JetBrains Mono', monospace;
font-size:10.5px;
letter-spacing:.1em;
color: rgba(248,244,238,0.55);
text-transform:uppercase;
}

@media (max-width:480px){
.cta-row{ flex-direction:column; width:100%; max-width:380px; }
.pill{ justify-content:center; width:100%; }
}
</style>
</head>
<body>

<footer>
<span>© 2026 Sweet Rabbit Man Official</span>

</div>
</body>
